name: Build NBT Evo libGaugeApp.so

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the BMW libraries are present
        run: |
          test -f lib/NBT_evo_libs/libAppFramework.A.so || { echo "lib/NBT_evo_libs/libAppFramework.A.so missing"; exit 1; }
          test -f lib/NBT_evo_libs/libCoreFramework.A.so || { echo "lib/NBT_evo_libs/libCoreFramework.A.so missing"; exit 1; }

      - name: Clone the QNX 6.5 armv7 toolchain
        run: git clone --depth 1 https://github.com/luka-dev/qnx65-armv7-toolchain.git /tmp/qnx-tc

      - name: Build the QNX toolchain image (once, slow)
        run: docker build --platform=linux/amd64 --target base-4.9 -t qnx65-armv7-toolchain /tmp/qnx-tc

      - name: Build libGaugeApp.so (NBT Evo)
        run: |
          docker run --rm -v "$PWD:/src" -w /src qnx65-armv7-toolchain \
            arm-unknown-nto-qnx6.5.0eabi-g++ -std=gnu++98 -O2 -Wall -D_QNX_SOURCE \
            -march=armv7-a -mfpu=vfpv3 -mfloat-abi=softfp -fPIC -I./src \
            -shared -Wl,-soname,libGaugeApp.so -static-libstdc++ -static-libgcc \
            -o libGaugeApp.so src/engine_data.cpp \
            lib/NBT_evo_libs/libAppFramework.A.so lib/NBT_evo_libs/libCoreFramework.A.so \
            -Wl,--allow-shlib-undefined

      - name: Verify the library
        run: |
          docker run --rm -v "$PWD:/src" -w /src qnx65-armv7-toolchain sh -c \
            'arm-unknown-nto-qnx6.5.0eabi-readelf -h libGaugeApp.so | grep -E "Class:|Machine:"; \
             ! arm-unknown-nto-qnx6.5.0eabi-nm -D -u libGaugeApp.so | grep -q GLIBCXX'

      - name: Upload libGaugeApp.so
        uses: actions/upload-artifact@v4
        with:
          name: libGaugeApp-so-nbt
          path: libGaugeApp.so
